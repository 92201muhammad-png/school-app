<!-- سٹوڈنٹ رجسٹریشن فارم -->
<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: Jameel Noori Nastaleeq, sans-serif;">
    <h3>نیا طالب علم شامل کریں</h3>
    
    <label>طالب علم کا نام:</label><br>
    <input type="text" id="studentName" placeholder="نام درج کریں" style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>

    <label>ولدیت (والد کا نام):</label><br>
    <input type="text" id="studentFather" placeholder="ولدیت درج کریں" style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>

    <label>کلاس:</label><br>
    <input type="text" id="studentClass" placeholder="کلاس درج کریں" style="width: 100%; padding: 8px; margin-bottom: 15px;"><br>

    <button onclick="addStudent()" style="background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">محفوظ کریں</button>
</div>

<!-- سٹوڈنٹس کی لسٹ -->
<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h3>رجستر شدہ سٹوڈنٹس کی فہرست</h3>
    <ul id="studentList" style="padding-right: 20px;">
        <!-- یہاں سٹوڈنٹس شو ہوں گے -->
    </ul>
</div>

<script>
    // جب صفحہ لوڈ ہو تو پہلے سے محفوظ ڈیٹا دکھائیں
    window.onload = function() {
        displayStudents();
    }

    function addStudent() {
        let name = document.getElementById("studentName").value;
        let father = document.getElementById("studentFather").value;
        let studentClass = document.getElementById("studentClass").value;

        if(name === "" || father === "") {
            alert("براہ کرم نام اور ولدیت دونوں درج کریں!");
            return;
        }

        let studentObj = { name: name, father: father, class: studentClass };

        // پرانا ڈیٹا حاصل کریں یا نئی لسٹ بنائیں
        let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];
        students.push(studentObj);

        // براؤزر میں محفوظ کریں
        localStorage.setItem("schoolStudents", JSON.stringify(students));

        // فیلڈز صاف کریں
        document.getElementById("studentName").value = "";
        document.getElementById("studentFather").value = "";
        document.getElementById("studentClass").value = "";

        displayStudents();
    }

    function displayStudents() {
        let listContainer = document.getElementById("studentList");
        listContainer.innerHTML = "";
        
        let students = JSON.parse(localStorage.getItem("schoolStudents")) || [];

        students.forEach(function(student, index) {
            let li = document.createElement("li");
            li.innerHTML = `<strong>${student.name}</strong> - ولدیت: ${student.father} (کلاس: ${student.class})`;
            listContainer.appendChild(li);
        });
    }
</script>
